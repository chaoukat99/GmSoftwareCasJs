<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>
    <h1 class="text-center">Manage Product </h1>

    <div class="row">
        <div class="col-6">
            <table class="table table-hover">
                 <thead>
                    <tr>
                        <th>Id</th>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Image</th>
                    </tr>
                 </thead>
                 <tbody>

                 </tbody>
            </table>
        </div>
        <div class="col-6">
            <label for="" class="label-control">Product Name</label>
            <input type="text" name="" class="form-control" id="">
            <label for="" class="label-control">Product Price</label>
            <input type="number" name="" class="form-control" id="">
            <label for="" class="label-control">Image Url</label>
            <input type="url" name="" class="form-control" id="">
            <button class="btn btn-primary">Add Product</button>
        </div>
    </div>


<script>


    const Inputs=document.querySelectorAll(".form-control");
   const button=document.querySelector("button") ;
   const tBody=document.querySelector("tbody");



   // Logic



   function AddProduct(){
     let tr=document.createElement("tr");
     let td1=document.createElement("td");
     let td2=document.createElement("td");
     let td3=document.createElement("td");
     let td4=document.createElement("td");
     let Img=document.createElement("img");
     const random=Math.floor(Math.random()*20000);
      td1.innerHTML=random;
      td2.innerHTML=Inputs[0].value;
      td3.innerHTML=Inputs[1].value;
      Img.src=Inputs[2].value
      Img.style.width="200px";
      Img.style.display="block";
      Img.style.height="300px !important"
      td4.append(Img);
      tr.append(td1,td2,td3,td4);

      tBody.append(tr);

     for(let i of Inputs){
    i.value="";
}


     //let str=`<tr><td>${Inputs[0].value}</td><td>${Inputs[1].value}</td>td><img src=${Inputs[2].value} /></td></tr>`

   //  tBody.append(str);

}




button.onclick=()=>{

    AddProduct();
}

</script>


</body>
</html>
